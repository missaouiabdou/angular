<h1>{{ title }}</h1>

<input #nouveauTitreInput type="text">
<button (click)="changeTitre(nouveauTitreInput.value)">Changer le titre</button>
<button (click)="supprimerTitre()" [disabled]="title === ''">Supprimer le titre</button>

<h2>Mes Tâches</h2>

<button (click)="viderTaches()" [disabled]="tasks.length === 0">Vider</button>
<button (click)="reinitialiserTaches()" [disabled]="tasks.length > 0">Réinitialiser</button>

<ul>
  @for (task of tasks; track task.id) {
    <li>{{ task.title | uppercase }} - {{ task.dueDate | date:'dd/MM/yyyy' }} - {{ task.priority }}</li>
  } @empty {
    <p>Aucune tâche pour l'instant</p>
  }
</ul>
